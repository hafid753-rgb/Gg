  percent: [فالمية, بالمية, پورسون, "%"]
  minute:  [دقيقة, دگايگ, دگيگة]
  hour:    [ساعة, ساعات]
  second:  [ثانية, ثواني]
  half_hour: [نص ساعة, انصّ ساعة]
  quarter_hour: [ربع ساعة]

