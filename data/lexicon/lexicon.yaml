# French numerals are heavily used in Nouakchott speech for temperatures/percent
numbers_fr:
  16: seize
  18: dix-huit
  20: vingt
  22: vingt-deux
  24: vingt-quatre
  25: vingt-cinq
  26: vingt-six
  30: trente
  50: cinquante
  100: cent

units:
