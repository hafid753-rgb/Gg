  12: [اطناعش]
  13: [اثلطاعش]
  14: [اربعطاعش]
  15: [خمسطاعش]
  16: [سطّاعش]
  17: [سبعطاعش]
  18: [اثمنطاعش]
  19: [تسعطاعش]
