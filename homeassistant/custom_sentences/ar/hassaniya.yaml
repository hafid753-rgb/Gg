  deg: (درجة|دراجات|دوگري)
  how_much: (كم|اشحال|گدّاش|گداش)
  is_it: (ياك|واش|هل)
  timer_word: (منبّه|منبه|تايمر|عدّاد|عداد|مينوتري)
  timer_word_def: (المنبّه|المنبه|التايمر|العدّاد|العداد)
