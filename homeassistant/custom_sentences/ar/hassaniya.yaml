  media: (التلفزة|التلفزيون|التيلي|الراديو|السبيكر|لوباف|البافل)
  curtain: (الريدو|الريدوات|الستارة)
  v_turn_on: (اگدي|اگدو|تگدي لي|اشعل|شعّل|شعل|حلّ|حل|اشعلي|شعّلي|شعلي|(نبغي|ابغيت|نبغيك|راني نبغي|نبغي منك) (تگدي لي))
  v_turn_on_device: (اگدي|اگدو|تگدي لي|شعّل|شعل|حلّ|حل|دوّر|دور|اشعل|(نبغي|ابغيت|نبغيك|راني نبغي|نبغي منك) (تگدي لي))
